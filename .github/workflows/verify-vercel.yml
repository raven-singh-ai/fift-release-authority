name: Verify Vercel release evidence
run-name: Verify ${{ inputs.candidate_sha }} / ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character target candidate SHA
        required: true
        type: string
      deployment_id:
        description: Exact Vercel deployment ID
        required: true
        type: string
      expected_hostname:
        description: Exact protected Preview hostname
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    environment: production-authority
    steps:
      - name: Checkout protected authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.AUTHORITY_GITHUB_TOKEN }}

      - name: Authenticate Vercel and create bounded evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EXPECTED_HOSTNAME: ${{ inputs.expected_hostname }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/verify-vercel.mjs

      - name: Attest exact evidence bytes with GitHub OIDC
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: out/vercel-${{ inputs.candidate_sha }}.json
          show-summary: true

      - name: Publish identical bytes at a retained parentless evidence commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          evidence="out/vercel-${CANDIDATE_SHA}.json"
          evidence_path="vercel/${CANDIDATE_SHA}.json"
          retained_ref="refs/heads/evidence-vercel/${CANDIDATE_SHA}/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          blob="$(git hash-object -w "$evidence")"
          index="$(mktemp)"
          rm -f "$index"
          export GIT_INDEX_FILE="$index"
          git read-tree --empty
          git update-index --add --cacheinfo "100644,$blob,$evidence_path"
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(printf 'Vercel authority evidence for %s\n' "$CANDIDATE_SHA" | git commit-tree "$tree")"

          # Every authority run gets a distinct retained ref. The proof commit
          # remains parentless and exact-tree-verifiable, but a concurrent run
          # can no longer orphan it by moving the legacy shared evidence ref.
          git push origin "$commit:$retained_ref"
          test "$(git ls-remote origin "$retained_ref" | cut -f1)" = "$commit"

          # Compatibility bridge for consumers still pinned to the previous
          # ceremony. New consumers authenticate the declared commit itself and
          # use the retained ref only to keep that object reachable.
          git push --force origin "$commit:refs/heads/evidence"
          test "$(git ls-remote origin refs/heads/evidence | cut -f1)" = "$commit"
          printf '### Evidence commit\n`%s`\n\n### Retained evidence ref\n`%s`\n' "$commit" "$retained_ref" >> "$GITHUB_STEP_SUMMARY"
